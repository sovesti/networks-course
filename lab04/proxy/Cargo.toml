[package]
name = "proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bytes = "1.11.1"
env_logger = "0.11.10"
futures-util = "0.3.32"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
log = "0.4.29"
reqwest = { version = "0.13.2", features = ["stream"] }
serde = { version = "1.0.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.18"
toml = "1.0.0"
